global:
  handoff_prev_end_to_next_start: false

actions:
  - id: pcie_from_tray_to_board
    description: "Nhóm tác vụ độc lập: Lấy PCIe cable từ tray gắn vào board."
    max_action_frames: 220
    phases:
      - id: "hand_in_tray"
        conditions:
          - type: "iou"
            subject: "hand"
            target: "tray"
            min_thr: 0.003
        hold_frames: 1
      - id: "hand_leaves_tray_with_pcie"
        conditions:
          - type: "not_iou"
            subject: "hand"
            target: "tray"
            max_thr: 0.02
          - type: "iou"
            subject: "hand"
            target: "PCIe cable"
            min_thr: 0.02
        hold_frames: 1
        grace_miss: 24
      - id: "release_pcie_on_board"
        conditions:
          - type: "iou"
            subject: "PCIe cable"
            target: "board"
            min_thr: 0.25
          - type: "not_iou"
            subject: "hand"
            target: "PCIe cable"
            max_thr: 0.02
        hold_frames: 14
        grace_miss: 240
