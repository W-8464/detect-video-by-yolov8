global:
  handoff_prev_end_to_next_start: false

actions:
  - id: board_back_to_conveyor
    description: "Nhóm tác vụ độc lập: Lấy board đặt lại chuyền. (Chỉ tính giờ từ khi board TỪ TRONG jig bắt đầu bị rút ra). Hỗ trợ camera nhìn thấy truyền: kết thúc khi board rời khỏi khu vực thao tác (3/4 dưới)."
    max_action_frames: 0
    timer_start_phase: 1  # Đồng hồ đếm thời gian thực thi chỉ bắt đầu từ Phase 1
    phases:
      - id: "board_stable_in_jig_or_static"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "contain"
                subject: "Target"
                target: "jig"
                min_thr: 0.90
              - type: "stationary"
                subject: "Target"
                history_len: 10
                min_iou: 0.85
        hold_frames: 30
        
      - id: "board_starts_leaving_stable_state"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "not_contain"
                subject: "Target"
                target: "jig"
                max_thr: 0.88
              - type: "missing"
                subject: "Target"
              # Nhánh mới: board vẫn visible nhưng đã rời khu vực thao tác (đang trên đường lên truyền)
              - type: "missing_in_zone"
                subject: "Target"
                zone_y_min_ratio: 0.25
                zone_y_max_ratio: 1.0
        hold_frames: 15
        grace_miss: 30

      - id: "board_gone_from_work_area"
        conditions:
          - type: "or"
            sub_conditions:
              # Camera không thấy truyền: board biến mất hoàn toàn
              - type: "missing"
                subject: "Target"
              # Camera thấy truyền: board không còn ở khu vực thao tác (3/4 dưới)
              - type: "missing_in_zone"
                subject: "Target"
                zone_y_min_ratio: 0.25
                zone_y_max_ratio: 1.0
        hold_frames: 4
        grace_miss: 10

    score_rules:
      verification:
        component: "Target"
        prerequisite: true
        mode: "zone_transition"
        post_frames: 60
        min_hits: 1
