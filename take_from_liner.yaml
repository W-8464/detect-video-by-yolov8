global:
  handoff_prev_end_to_next_start: true

actions:
  - id: take_from_liner
    description: "Nhóm tác vụ đặc biệt: Lấy kiện từ liner trên bàn (gasket) VÀ gắn lên đích. Phase 0 dùng liner thay cho container."
    max_action_frames: 0
    timer_start_phase: 0
    phases:
      - id: "hand_grabs_from_liner"
        conditions:
          - type: "iou"
            subject: "hand"
            target: "liner"
            min_thr: 0.30
        hold_frames: 2
        grace_miss: 30

      - id: "bring_component_to_target"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "contain"
                subject: "hand"
                target: "Target"
                min_thr: 0.15
              - type: "iou"
                subject: "hand"
                target: "Target"
                min_thr: 0.02
        hold_frames: 5
        grace_miss: 120

      - id: "release_component_on_target"
        conditions:
          - type: "contain"
            subject: "Component"
            target: "Target"
            min_thr: 0.20
          - type: "not_iou"
            subject: "hand"
            target: "Component"
            max_thr: 0.06
        hold_frames: 10
        grace_miss: 240
