global:
  handoff_prev_end_to_next_start: true
  class_groups:
    Component:
    - PCIe cable
    - shielding
    - gasket
    Tool:
    - tweezers
    Target:
    - board
    - bracket
    Container:
    - tray
  class_colors:
    hand:
    - 0
    - 255
    - 0
    tray:
    - 255
    - 0
    - 0
    board:
    - 0
    - 0
    - 255
    jig:
    - 255
    - 255
    - 0
    liner:
    - 0
    - 255
    - 255
    tweezers:
    - 128
    - 255
    - 128
    shielding:
    - 255
    - 128
    - 0
    PCIe cable:
    - 255
    - 0
    - 255
    gasket:
    - 128
    - 0
    - 255
    bracket:
    - 0
    - 128
    - 255
  roi_model_mapping:
    0: hand
    1: tweezers
    2: shielding
    3: gasket
  roi_small_classes:
  - shielding
  - gasket
  tuning:
    conf_threshold: 0.55
    max_window_frames: 300
    rearm_frames: 10
    phase_start_wait_frames: 220
    semantic_lookback_frames: 300
    attach_anchor_max_gap_frames: 90
    gasket_attach_max_gap_frames: 220
    min_take_gasket_span_frames: 25
    scan_stride: 4
    roi_pad: 1.6
    return_role_threshold_offset: 0.1
    pose:
      imgsz: 416
      conf: 0.25
      iou: 0.5
      kpts_smooth_alpha: 0.7
      kpts_display_conf: 0.3
actions:
- id: put_board_into_jig_1
  description: 'Nhóm tác vụ độc lập: Đặt board vào jig. Bắt đầu khi board xuất hiện,
    hoàn thành khi board nằm gọn. Sau khi hoàn thành sẽ lưu CSV và đếm lại từ đầu.
    (lần 1)'
  max_action_frames: 0
  phases:
  - id: wait_board_appear
    conditions:
    - type: exists
      subject: Target
      min_count: 1
    - type: history_missing
      subject: Target
      history_len: 20
      min_missing_frames: 15
    hold_frames: 3
    grace_miss: 10
  - id: put_board_in_jig_or_static
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: Target
        target: jig
        min_thr: 0.9
      - type: stationary
        subject: Target
        history_len: 10
        min_iou: 0.85
    hold_frames: 30
    grace_miss: 30
- id: take_PCIe_cable_1
  description: 'Nhóm tác vụ độc lập: Lấy 1 kiện từ khay kéo ra khỏi khay. (lần 1)'
  max_action_frames: 0
  timer_start_phase: 0
  phases:
  - id: hand_enters_container_but_not_target
    conditions:
    - type: contain
      subject: hand
      target: Container
      min_thr: 0.35
    - type: not_contain
      subject: hand
      target: Target
      max_thr: 0.3
    - type: or
      sub_conditions:
      - type: iou
        subject: hand
        target: Component
        min_thr: 0.005
      - type: history_exists
        subject: Component
        history_len: 8
        min_frames: 3
    hold_frames: 4
    grace_miss: 20
  - id: hand_leaves_container_or_enters_target
    conditions:
    - type: or
      sub_conditions:
      - type: not_contain
        subject: hand
        target: Container
        max_thr: 0.3
      - type: contain
        subject: hand
        target: Target
        min_thr: 0.3
    hold_frames: 3
    grace_miss: 20
  score_rules:
    spatial:
      subject: hand
      target: Container
      weight: 1.0
    temporal:
      subject: hand
      target: Container
      threshold: 0.3
      min_frames: 5
      max_frames: 40
      weight: 0.5
    verification:
      effector: hand
      component: Component
      post_frames: 60
      min_hits: 3
      weight: 3.0
      prerequisite: true
- id: attach_PCIe_cable_1
  description: 'Nhóm tác vụ độc lập: Gắn linh kiện lên đích. (lần 1)'
  max_action_frames: 180
  timer_start_phase: 1
  phases:
  - id: hand_moves_to_target
    conditions:
    - type: contain
      subject: hand
      target: Target
      min_thr: 0.2
    - type: stationary
      subject: Target
      history_len: 15
      min_iou: 0.75
    hold_frames: 3
    grace_miss: 20
  - id: component_placed_on_target
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: Component
        target: Target
        min_thr: 0.2
      - type: history_exists
        subject: Component
        history_len: 10
        min_frames: 1
    hold_frames: 3
    grace_miss: 15
  - id: hand_leaves_target_or_enters_container
    conditions:
    - type: or
      sub_conditions:
      - type: not_contain
        subject: hand
        target: Target
        max_thr: 0.2
      - type: contain
        subject: hand
        target: Container
        min_thr: 0.4
    hold_frames: 10
    grace_miss: 20
  score_rules:
    spatial:
      subject: hand
      target: Target
      weight: 1.0
    temporal:
      subject: hand
      target: Target
      threshold: 0.3
      min_frames: 5
      max_frames: 40
      weight: 0.5
- id: take_shielding_2
  description: 'Nhóm tác vụ độc lập: Lấy 1 kiện từ khay kéo ra khỏi khay. (lần 2)'
  max_action_frames: 0
  timer_start_phase: 0
  phases:
  - id: hand_enters_container_but_not_target
    conditions:
    - type: contain
      subject: hand
      target: Container
      min_thr: 0.35
    - type: not_contain
      subject: hand
      target: Target
      max_thr: 0.3
    - type: or
      sub_conditions:
      - type: iou
        subject: hand
        target: Component
        min_thr: 0.005
      - type: history_exists
        subject: Component
        history_len: 8
        min_frames: 3
    hold_frames: 4
    grace_miss: 20
  - id: hand_leaves_container_or_enters_target
    conditions:
    - type: or
      sub_conditions:
      - type: not_contain
        subject: hand
        target: Container
        max_thr: 0.3
      - type: contain
        subject: hand
        target: Target
        min_thr: 0.3
    hold_frames: 3
    grace_miss: 20
  score_rules:
    spatial:
      subject: hand
      target: Container
      weight: 1.0
    temporal:
      subject: hand
      target: Container
      threshold: 0.3
      min_frames: 5
      max_frames: 40
      weight: 0.5
    verification:
      effector: hand
      component: Component
      post_frames: 60
      min_hits: 3
      weight: 3.0
      prerequisite: true
- id: take_gasket_3
  description: Lay gasket bang tweezers/hand tu liner hoac tray. (lần 3)
  max_action_frames: 0
  timer_start_phase: 0
  phases:
  - id: effector_contacts_gasket_in_source
    conditions:
    - type: and
      sub_conditions:
      - type: or
        sub_conditions:
        - type: iou
          subject: tweezers
          target: gasket
          min_thr: 0.02
        - type: iou
          subject: hand
          target: gasket
          min_thr: 0.02
        - type: same_roi
          subject: tweezers
          target: gasket
      - type: or
        sub_conditions:
        - type: contain
          subject: gasket
          target: liner
          min_thr: 0.2
        - type: contain
          subject: gasket
          target: tray
          min_thr: 0.2
    hold_frames: 5
    grace_miss: 40
  - id: gasket_leaves_source
    conditions:
    - type: and
      sub_conditions:
      - type: or
        sub_conditions:
        - type: iou
          subject: tweezers
          target: gasket
          min_thr: 0.01
        - type: iou
          subject: hand
          target: gasket
          min_thr: 0.01
        - type: same_roi
          subject: tweezers
          target: gasket
      - type: not_contain
        subject: tweezers
        target: liner
        max_thr: 0.05
      - type: not_contain
        subject: tweezers
        target: tray
        max_thr: 0.05
    hold_frames: 15
    grace_miss: 60
- id: apply_gasket_to_shielding_1
  description: 'Dac thu: Gasket duoc dan vao Shielding khi hai lieu chong len nhau.
    (lần 1)'
  max_action_frames: 0
  timer_start_phase: 0
  phases:
  - id: pick_gasket_with_tweezers
    conditions:
    - type: or
      sub_conditions:
      - type: iou
        subject: tweezers
        target: gasket
        min_thr: 0.02
      - type: iou
        subject: hand
        target: gasket
        min_thr: 0.02
    hold_frames: 2
    grace_miss: 20
  - id: gasket_overlaps_shielding
    conditions:
    - type: contain
      subject: gasket
      target: shielding
      min_thr: 0.15
    hold_frames: 2
    grace_miss: 10
  - id: tweezers_leaves_shielding
    conditions:
    - type: not_iou
      subject: tweezers
      target: shielding
      max_thr: 0.01
    hold_frames: 3
    grace_miss: 30
- id: attach_shielding_and_gasket
  description: 'Nhóm tác vụ đặc thù: Gắn cụm Shielding đã dán Gasket lên Board.'
  max_action_frames: 180
  timer_start_phase: 1
  phases:
  - id: hand_moves_payload_to_board
    conditions:
    - type: contain
      subject: hand
      target: Target
      min_thr: 0.12
    - type: not_iou
      subject: tweezers
      target: shielding
      max_thr: 0.05
    - type: stationary
      subject: Target
      history_len: 12
      min_iou: 0.75
    hold_frames: 8
    grace_miss: 10
  - id: payload_placed_on_board
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: GasketPayload
        target: Target
        min_thr: 0.15
      - type: history_exists
        subject: GasketPayload
        history_len: 20
        min_frames: 1
    hold_frames: 3
    grace_miss: 10
  - id: hand_leaves_shielding
    conditions:
    - type: exists
      subject: shielding
      min_count: 1
    - type: not_iou
      subject: hand
      target: shielding
      max_thr: 0.005
    hold_frames: 8
    grace_miss: 35
  score_rules:
    spatial:
      subject: hand
      target: Target
      weight: 1.0
    temporal:
      subject: hand
      target: Target
      threshold: 0.2
      min_frames: 4
      max_frames: 50
      weight: 0.5
- id: board_back_to_conveyor_1
  description: 'Nhóm tác vụ độc lập: Lấy board đặt lại chuyền. (Chỉ tính giờ từ khi
    board TỪ TRONG jig bắt đầu bị rút ra) (lần 1)'
  max_action_frames: 0
  timer_start_phase: 1
  phases:
  - id: board_stable_in_jig_or_static
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: Target
        target: jig
        min_thr: 0.9
      - type: stationary
        subject: Target
        history_len: 10
        min_iou: 0.85
    hold_frames: 30
  - id: board_starts_leaving_stable_state
    conditions:
    - type: or
      sub_conditions:
      - type: not_contain
        subject: Target
        target: jig
        max_thr: 0.88
      - type: missing
        subject: Target
    hold_frames: 15
    grace_miss: 30
  - id: board_missing_from_camera
    conditions:
    - type: missing
      subject: Target
    hold_frames: 4
    grace_miss: 10
