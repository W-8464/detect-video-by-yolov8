actions:
- id: put_board
  description: 'Nhóm tác vụ độc lập: Đặt board vào jig. Hỗ trợ 2 nhánh: (A) board
    mới xuất hiện từ ngoài frame, (B) hand mang board từ truyền (1/4 trên) xuống khu
    vực thao tác (3/4 dưới). Hoàn thành khi board nằm gọn trong jig hoặc đứng yên.'
  max_action_frames: 0
  phases:
  - id: wait_board_appear
    conditions:
    - type: or
      sub_conditions:
      - type: and
        sub_conditions:
        - type: exists
          subject: Target
          min_count: 1
        - type: history_missing
          subject: Target
          history_len: 20
          min_missing_frames: 15
      - type: and
        sub_conditions:
        - type: iou_in_zone
          subject: hand
          target: Target
          zone_y_min_ratio: 0.0
          zone_y_max_ratio: 0.25
          target_zone_y_min_ratio: 0.0
          target_zone_y_max_ratio: 0.25
          min_thr: 0.05
    hold_frames: 3
    grace_miss: 10
  - id: put_board_in_jig_or_static
    lock_subject_from_phase0: true
    conditions:
    - type: and
      sub_conditions:
      - type: exists_in_zone
        subject: Target
        zone_y_min_ratio: 0.25
        zone_y_max_ratio: 1.0
      - type: or
        sub_conditions:
        - type: contain
          subject: Target
          target: jig
          min_thr: 0.9
        - type: stationary
          subject: Target
          history_len: 10
          min_iou: 0.85
    hold_frames: 30
    grace_miss: 30
  score_rules:
    verification:
      component: Target
      prerequisite: true
      mode: zone_transition
      post_frames: 60
      min_hits: 1
- id: put_enclosure
  description: 'Nhóm tác vụ độc lập: Đặt board vào jig. Hỗ trợ 2 nhánh: (A) board
    mới xuất hiện từ ngoài frame, (B) hand mang board từ truyền (1/4 trên) xuống khu
    vực thao tác (3/4 dưới). Hoàn thành khi board nằm gọn trong jig hoặc đứng yên.'
  max_action_frames: 0
  phases:
  - id: wait_board_appear
    conditions:
    - type: or
      sub_conditions:
      - type: and
        sub_conditions:
        - type: exists
          subject: Target
          min_count: 1
        - type: history_missing
          subject: Target
          history_len: 20
          min_missing_frames: 15
      - type: and
        sub_conditions:
        - type: iou_in_zone
          subject: hand
          target: Target
          zone_y_min_ratio: 0.0
          zone_y_max_ratio: 0.25
          target_zone_y_min_ratio: 0.0
          target_zone_y_max_ratio: 0.25
          min_thr: 0.05
    hold_frames: 3
    grace_miss: 10
  - id: put_board_in_jig_or_static
    lock_subject_from_phase0: true
    conditions:
    - type: and
      sub_conditions:
      - type: exists_in_zone
        subject: Target
        zone_y_min_ratio: 0.25
        zone_y_max_ratio: 1.0
      - type: or
        sub_conditions:
        - type: contain
          subject: Target
          target: jig
          min_thr: 0.9
        - type: stationary
          subject: Target
          history_len: 10
          min_iou: 0.85
    hold_frames: 30
    grace_miss: 30
  score_rules:
    verification:
      component: Target
      prerequisite: true
      mode: zone_transition
      post_frames: 60
      min_hits: 1
- id: return_bottom_cover
  description: 'Nhóm tác vụ độc lập: Lấy board đặt lại chuyền. (Chỉ tính giờ từ khi
    board TỪ TRONG jig bắt đầu bị rút ra). Hỗ trợ camera nhìn thấy truyền: kết thúc
    khi board rời khỏi khu vực thao tác (3/4 dưới).'
  max_action_frames: 0
  timer_start_phase: 1
  phases:
  - id: board_stable_in_jig_or_static
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: Target
        target: jig
        min_thr: 0.9
      - type: stationary
        subject: Target
        history_len: 10
        min_iou: 0.85
    hold_frames: 30
  - id: board_starts_leaving_stable_state
    conditions:
    - type: or
      sub_conditions:
      - type: not_contain
        subject: Target
        target: jig
        max_thr: 0.88
      - type: missing
        subject: Target
      - type: missing_in_zone
        subject: Target
        zone_y_min_ratio: 0.25
        zone_y_max_ratio: 1.0
    hold_frames: 15
    grace_miss: 30
  - id: board_gone_from_work_area
    conditions:
    - type: or
      sub_conditions:
      - type: missing
        subject: Target
      - type: missing_in_zone
        subject: Target
        zone_y_min_ratio: 0.25
        zone_y_max_ratio: 1.0
    hold_frames: 4
    grace_miss: 10
  score_rules:
    verification:
      component: Target
      prerequisite: true
      mode: zone_transition
      post_frames: 60
      min_hits: 1
