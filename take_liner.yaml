global:
  handoff_prev_end_to_next_start: true

actions:
  - id: take_liner
    description: "Lấy liner (khay đệm): tay tiếp xúc liner, liner di chuyển khỏi vị trí ban đầu. Áp dụng cho liner trong tray hoặc trên bàn."
    max_action_frames: 0
    timer_start_phase: 0
    phases:
      - id: hand_contacts_liner
        conditions:
          - type: iou
            subject: hand
            target: liner
            min_thr: 0.04
        hold_frames: 3
        grace_miss: 40

      - id: liner_moves
        conditions:
          - type: not_stationary
            subject: liner
            history_len: 10
            max_iou: 0.70
        hold_frames: 10
        grace_miss: 90
