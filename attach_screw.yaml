global:
  handoff_prev_end_to_next_start: true

actions:
  - id: attach_screw
    description: "Tác vụ: Bắn vít (cầm screw driver lấy vít từ screw machine và bắn lên fixture)."
    max_action_frames: 0
    timer_start_phase: 0
    phases:
      - id: "driver_at_screw_machine"
        conditions:
          - type: "and"
            sub_conditions:
              - type: "iou"
                subject: "hand"
                target: "screw driver"
                min_thr: 0.05
              - type: "or"
                sub_conditions:
                  - type: "iou"
                    subject: "screw driver"
                    target: "screw machine"
                    min_thr: 0.02
                  - type: "iou"
                    subject: "hand"
                    target: "screw machine"
                    min_thr: 0.05
        hold_frames: 1
        grace_miss: 35

      - id: "driver_at_fixture"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "iou"
                subject: "screw driver"
                subject_region: "bottom_half"
                target: "fixture"
                min_thr: 0.02
              # - type: "iou"
              #   subject: "hand"
              #   target: "fixture"
              #   min_thr: 0.05
        hold_frames: 2
        grace_miss: 40

      - id: "driver_leaves_fixture"
        conditions:
          - type: "not_iou"
            subject: "screw driver"
            subject_region: "bottom_half"
            target: "fixture"
            max_thr: 0.02
        hold_frames: 2
        grace_miss: 30
        wait_for_flip: true
        min_false_frames: 3
