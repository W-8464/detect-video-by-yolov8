actions:
- id: put_board_into_jig_1
  description: 'Nhóm tác vụ độc lập: Đặt board vào jig. Bắt đầu khi board xuất hiện,
    hoàn thành khi board nằm gọn. Sau khi hoàn thành sẽ lưu CSV và đếm lại từ đầu.
    (lần 1)'
  max_action_frames: 0
  phases:
  - id: wait_board_appear
    conditions:
    - type: exists
      subject: Target
      min_count: 1
    - type: history_missing
      subject: Target
      history_len: 20
      min_missing_frames: 15
    hold_frames: 3
    grace_miss: 10
  - id: put_board_in_jig_or_static
    conditions:
    - type: or
      sub_conditions:
      - type: contain
        subject: Target
        target: jig
        min_thr: 0.9
      - type: stationary
        subject: Target
        history_len: 10
        min_iou: 0.85
    hold_frames: 30
    grace_miss: 30
- id: take_component_1
  description: 'Nhóm tác vụ độc lập (Quy nạp): Lấy 1 kiện bất kỳ từ khay, kéo ra,
    và dán/gắn lên đích. (lần 1)'
  max_action_frames: 0
  timer_start_phase: 0
  phases:
  - id: hand_grabs_component_in_container
    conditions:
    - type: iou
      subject: hand
      target: Container
      min_thr: 0.003
    - type: iou
      subject: hand
      target: Component
      min_thr: 0.05
    hold_frames: 2
    grace_miss: 30
  - id: release_component_on_target
    conditions:
    - type: contain
      subject: Component
      target: Target
      min_thr: 0.2
    - type: not_iou
      subject: hand
      target: Component
      max_thr: 0.06
    hold_frames: 10
    grace_miss: 240
