global:
  handoff_prev_end_to_next_start: true

actions:
  - id: attach_component
    description: "Nhóm tác vụ độc lập: Gắn linh kiện lên đích."
    max_action_frames: 180
    timer_start_phase: 1
    phases:
      - id: "hand_moves_to_target"
        conditions:
          - type: "contain"
            subject: "hand"
            target: "Target"
            min_thr: 0.30
          - type: "stationary"
            subject: "Target"
            history_len: 15
            min_iou: 0.85
        hold_frames: 3
        grace_miss: 15
      - id: "component_placed_on_target"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "contain"
                subject: "Component"
                target: "Target"
                min_thr: 0.20
              - type: "history_exists"
                subject: "Component"
                history_len: 10
                min_frames: 1
          # - type: "release"
          #   subject: "hand"
          #   max_thr: 0.35
        hold_frames: 3
        grace_miss: 15
      - id: "hand_leaves_target_or_enters_container"
        conditions:
          - type: "or"
            sub_conditions:
              - type: "not_contain"
                subject: "hand"
                target: "Target"
                max_thr: 0.20
              - type: "contain"
                subject: "hand"
                target: "Container"
                min_thr: 0.40
        hold_frames: 10
        grace_miss: 15

    score_rules:
      spatial:
        subject: "hand"
        target: "Target"
        weight: 1.0
      temporal:
        subject: "hand"
        target: "Target"
        threshold: 0.30
        min_frames: 5
        max_frames: 40
        weight: 0.5
      # We skip verification of hand/component here because attach means the component is left behind, 
      # not held. Let's just rely on space/time and placing component on target in Phase 1.
