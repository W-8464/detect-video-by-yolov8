global:
  handoff_prev_end_to_next_start: true

  class_groups:
    Component:
      - "PCIe cable"
      - "shielding"
      - "gasket"
      - "heatsink"
      - "screw"
      - "light pipe"
      - "rear panel"
      - "label"
    Tool:
      - "tweezers"
      - "screw driver"
      - "scanner"
    Target:
      - "board"
      - "bracket"
      - "enclosure"
      - "bottom cover"
    Container:
      - "tray"
    _frame_height: 1080

  class_colors:
    hand:       [0, 255, 0]
    tray:       [255, 0, 0]
    board:      [0, 0, 255]
    jig:        [255, 255, 0]
    liner:      [0, 255, 255]
    tweezers:   [128, 255, 128]
    shielding:  [255, 128, 0]
    PCIe cable: [255, 0, 255]
    gasket:     [128, 0, 255]
    bracket:    [0, 128, 255]
    heatsink:   [200, 100, 50]
    screw:      [150, 150, 150]
    "screw driver": [100, 200, 100]
    "screw machine": [100, 100, 200]
    fixture:    [50, 50, 50]
    "light pipe": [255, 150, 150]
    "bottom cover": [150, 255, 150]
    "rear panel": [150, 150, 255]
    enclosure:  [200, 200, 100]
    label:      [100, 200, 200]
    scanner:    [200, 100, 200]

  roi_model_mapping:
    0: hand
    1: tweezers
    2: shielding
    3: gasket
    4: label

  roi_small_classes:
    - shielding
    - gasket
    - label

  tuning:
    conf_threshold: 0.55
    min_match_frames: 10
    max_window_frames: 300
    rearm_frames: 5
    phase_start_wait_frames: 220
    semantic_lookback_frames: 300
    attach_anchor_max_gap_frames: 150
    gasket_attach_max_gap_frames: 220
    min_take_gasket_span_frames: 25
    scan_stride: 4
    roi_pad: 1.6
    return_role_threshold_offset: 0.1
    pose:
      imgsz: 416
      conf: 0.25
      iou: 0.5
      kpts_smooth_alpha: 0.7
      kpts_display_conf: 0.3
