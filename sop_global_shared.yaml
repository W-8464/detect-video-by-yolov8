global:
  handoff_prev_end_to_next_start: true

  class_groups:
    Component:
      - "PCIe cable"
      - "shielding"
      - "gasket"
      - "heatsink"
      - "screw"
    Tool:
      - "tweezers"
      - "screw driver"
    Target:
      - "board"
      - "bracket"
    Container:
      - "tray"
      - "screw machine"

  class_colors:
    hand:       [0, 255, 0]
    tray:       [255, 0, 0]
    board:      [0, 0, 255]
    jig:        [255, 255, 0]
    liner:      [0, 255, 255]
    tweezers:   [128, 255, 128]
    shielding:  [255, 128, 0]
    PCIe cable: [255, 0, 255]
    gasket:     [128, 0, 255]
    bracket:    [0, 128, 255]
    heatsink:   [200, 100, 50]
    screw:      [150, 150, 150]
    "screw driver": [100, 200, 100]
    "screw machine": [100, 100, 200]
    fixture:    [50, 50, 50]

  roi_model_mapping:
    0: hand
    1: tray
    2: board
    3: jig
    4: liner
    5: tweezers
    6: shielding
    7: PCIe cable
    8: gasket
    9: bracket
    10: heatsink
    11: screw
    12: "screw driver"
    13: "screw machine"
    14: fixture

  roi_small_classes:
    - shielding
    - gasket

  tuning:
    conf_threshold: 0.55
    min_match_frames: 10
    max_window_frames: 300
    rearm_frames: 10
    phase_start_wait_frames: 220
    semantic_lookback_frames: 300
    attach_anchor_max_gap_frames: 90
    gasket_attach_max_gap_frames: 220
    min_take_gasket_span_frames: 25
    scan_stride: 4
    roi_pad: 1.6
    return_role_threshold_offset: 0.1
    pose:
      imgsz: 416
      conf: 0.25
      iou: 0.5
      kpts_smooth_alpha: 0.7
      kpts_display_conf: 0.3
